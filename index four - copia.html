<html>
<head>
    <meta charset="UTF-8">
    <title>MONKY</title>

<style>

body {
    font-family: sans-serif;
    background: linear-gradient(135deg, #e0f2fe, #bae6fd);
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.tarjeta {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    display: flex;
    gap: 30px;
    align-items: center;
}

/* AQUÍ CORREGIMOS LA IMAGEN */
.imagen-monky {
    width: 450px;
    max-width: 100%;
    height: auto;
    display: block;
}

.formulario {
    width: 300px;
}

input[type="text"],
input[type="email"] {
    width: 100%;
    padding: 8px;
    margin: 6px 0 12px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    width: 100%;
    background: #0284c7;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
}

</style>

<script>

function guardarDatos(event) {

    event.preventDefault();

    let nombre = document.getElementById("nombre").value;
    let email = document.getElementById("email").value;
    let telefono = document.getElementById("telefono").value;

    let datos =
    `Nombre: ${nombre}
Email: ${email}
Teléfono: ${telefono}`;

    let blob = new Blob([datos], { type: "text/plain" });

    let enlace = document.createElement("a");

    enlace.href = URL.createObjectURL(blob);
    enlace.download = "registro.txt";
    enlace.click();

    alert("¡Datos guardados con éxito!");
}

</script>

</head>

<body>

<div class="tarjeta">

    <div>
        <img
            class="imagen-monky"
            src="C:\Users\cheps\Downloads\WhatsApp Image 2026-09-28 at 4.53.01 PM (1).jpeg"
            alt="MONKY">
    </div>

    <div class="formulario">

        <h2 style="margin: 0 0 15px 0; color: #0284c7;">
            Registro
        </h2>

        <form onsubmit="guardarDatos(event)">

            <label>Nombre:</label>
            <input type="text" id="nombre" required>

            <label>Email:</label>
            <input type="email" id="email" required>

            <label>Teléfono:</label>
            <input type="text" id="telefono" required>

            <div style="margin-bottom: 15px;">
                <input type="radio" id="acepto" name="terminos" required>
                <label for="acepto">Acepto Términos</label>
            </div>

            <button type="submit">Enviar</button>

        </form>

    </div>

</div>

</body>
</html>
